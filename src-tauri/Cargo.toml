[package]
name = "gamequiet"
version = "0.2.0"
edition = "2021"
description = "Make room for demanding work, then put things back"
license = "MIT"

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[lints]
workspace = true
